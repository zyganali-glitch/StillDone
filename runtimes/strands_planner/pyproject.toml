[project]
name = "stilldone-strands-planner"
version = "0.1.0"
description = "StillDone Strands Planner isolated runtime environment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "boto3>=1.35.0",
    "strands-agents==1.57.2",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["../../src"]
testpaths = [
    "../../tests/planning",
    "../../tests/domain",
    "../../tests/test_action_policy.py",
    "../../tests/test_authority_policy.py",
    "../../tests/test_capture.py",
    "../../tests/test_demo_isolation.py",
    "../../tests/test_endpoint_protection.py",
    "../../tests/test_evidence.py",
    "../../tests/test_ledger.py",
    "../../tests/test_phase_p03_adversarial.py",
    "../../tests/test_phase_p04_security_audit.py",
    "../../tests/test_receipt.py",
    "../../tests/test_redaction.py",
    "../../tests/test_serialization.py",
    "../../tests/test_smoke.py",
    "../../tests/test_transitions.py",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "../../src"
