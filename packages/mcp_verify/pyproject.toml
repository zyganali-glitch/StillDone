[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-verify"
version = "0.1.0"
description = "Deterministic Execute -> Read-back -> Verification middleware for Model Context Protocol (MCP) tools"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "StillDone Authors", email = "open-source@stilldone.dev" }
]
keywords = ["mcp", "ai-agents", "verification", "middleware", "safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_verify"]
