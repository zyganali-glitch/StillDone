name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned uv version
        uses: astral-sh/setup-uv@1327173e35a09b4074213d2f9540b61585802119 # v5
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Set up Python 3.13 maintenance release
        run: uv python install 3.13.15

      - name: Install dependencies strictly from lockfile
        run: uv sync --frozen

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Lint code
        run: uv run ruff check .

      - name: Static type check
        run: uv run mypy src tests

      - name: Run test suite
        run: uv run pytest

      - name: Run cross-platform aggregate validator
        run: uv run python scripts/validate.py
